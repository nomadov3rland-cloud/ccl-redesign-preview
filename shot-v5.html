<!doctype html><meta charset="utf-8"><title>v5 shot driver</title>
<style>html,body{margin:0;padding:0;background:#f1ecdc}iframe{border:0;display:block;width:100vw}</style>
<body>
<script>
var q = new URLSearchParams(location.search);
if (q.get("pins")) localStorage.setItem("ccl-pins-v1", JSON.stringify({cards:["ferry-card","tides-card"], answers:["bridge","tides","weather","events"]}));
if (q.get("view")) localStorage.setItem("ccl-view-v1", q.get("view"));
var f = document.createElement("iframe");
f.style.height = (q.get("h") || "1600") + "px";
f.src = "index.html" + (q.get("theme") ? "?theme=" + q.get("theme") : "");
f.onload = function(){ setTimeout(function(){
  try { if (q.get("drawer")) f.contentDocument.getElementById("menu-btn").click(); } catch(e){}
}, 1500); };
document.body.appendChild(f);
</script>
</body>
